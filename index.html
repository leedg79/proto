<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1119">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FRET LAB">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./css/app.css">
<title>FRET LAB</title>
</head>
<body>
<header class="topbar">
  <button class="nav-btn" id="backBtn" type="button" aria-label="뒤로가기">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>뒤로</span>
  </button>
  <div class="topbar-title" id="topTitle"><b>FRET</b> LAB</div>
  <button class="nav-btn home" id="homeBtn" type="button" aria-label="홈">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></svg><span>홈</span>
  </button>
</header>

<div class="audio-banner hidden" id="audioBanner" role="alert"><span>오디오가 멈춤 · 소리와 박자가 진행되지 않음</span><button class="btn small primary" id="audioFix" type="button">다시 연결</button></div>

<main id="view" tabindex="-1"></main>

<div class="session-dock hidden" id="sessionDock" role="button" tabindex="0">
  <span class="dock-dot" id="dockDot"></span>
  <span class="dock-text" id="dockText">진행 중 세션</span>
  <span class="dock-time" id="dockTime">00:00</span>
  <span class="dock-go">이어가기 ›</span>
</div>

<div class="modal hidden" id="modal" role="dialog" aria-modal="true">
  <div class="modal-card">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<div class="toast hidden" id="toast" role="status"></div>

<noscript>이 앱은 JavaScript가 필요함</noscript>
<script src="vendor/vexflow-bravura.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
